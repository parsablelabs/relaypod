# RelayPod client configuration
# Auto-created at ~/.config/relaypod/config.yaml on first launch of RelayPod UI (or pass `--config <path>`)
# Used by: RelayPod desktop UI, `relaypod` CLI, and headless `relaypod watch`

url: http://127.0.0.1:8787
# Optional human bearer token for UI auto-login and CLI commands
# (environment variable RELAYPOD_TOKEN takes precedence)
# token: rp_...

watcher:
  # Optional default instructions / team norms file prepended once per new thread session
  # (see config/team-norms.md for a starter engineering team norms template)
  instructions_file: ~/.config/relaypod/team-norms.md
  # Optional global max concurrent open sessions across all handles (LRU eviction for Herdr; 0/omit = unlimited)
  global_max_sessions: 10
  # Circuit breaker: max consecutive agent-authored turns in a thread before pausing and pinging the human
  # (defaults to 6; set to 0 to disable)
  max_consecutive_agent_turns: 6

  agent_tokens:
    # Flat map of unique local names to agent bearer tokens (supports ${ENV_VAR} expansion).
    # Runner, harness, args, cwd, cooldown_secs, max_sessions, auto_ack,
    # drain_on_start, instructions_file, and prompt are stored in the server DB and editable
    # live in the RelayPod UI (Edit agent) or via `relaypod identity update`.
    #
    # Creating an agent in the UI (with "Watch on this machine" checked) or via
    # `relaypod identity create <handle>` automatically appends an entry here.
    mbp-codex: ${RELAYPOD_CODEX_TOKEN}
    # mbp-claude: ${RELAYPOD_CLAUDE_TOKEN}
