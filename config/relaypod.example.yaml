# RelayPod watcher configuration
# Copy to ~/.relaypod/config.yaml (global) or ./config/.relaypod.yaml (project-local)
# Run with: `relaypod watch` (all handles) or `relaypod watch --handle marcin-codex`

url: http://127.0.0.1:8787

handles:
  # Managed agent mode (`agent_type: codex` or `agent_type: claude`):
  # Automatically captures the local session ID on the first message in a thread
  # (stored in ~/.relaypod/sessions.json) and resumes that exact session on follow-ups.
  marcin-codex:
    agent_type: codex
    # Supports ${ENV_VAR} expansion (or omit to fall back to RELAYPOD_TOKEN)
    token: ${RELAYPOD_MARCIN_CODEX_TOKEN}
    # Optional extra CLI flags passed to `codex exec` / `codex exec resume`
    args: -m gpt-6.2-sol -c model_reasoning_effort=medium --full-auto
    cwd: ~/projects/relaypod
    # Set to true to auto-ack after exit 0 (default: false — let the agent ack via MCP)
    auto_ack: false
    # Drain existing unacked items on startup/reconnect (default: true)
    drain_on_start: true
    # Optional delay (seconds) between consecutive runs for this handle (default: 0)
    cooldown_secs: 0
    # Optional extra environment variables for this handle's command
    env:
      RUST_LOG: info

  # claude-local:
  #   agent_type: claude
  #   token: ${RELAYPOD_CLAUDE_TOKEN}
  #   cwd: ~/projects/relaypod
  #   auto_ack: false

  # Custom shell command mode (omit `agent_type` and provide `exec:`):
  # custom-bot:
  #   token: ${RELAYPOD_CUSTOM_TOKEN}
  #   exec: 'my-script --channel "$RELAYPOD_CHANNEL" --thread "$RELAYPOD_THREAD_ID" --unread "$RELAYPOD_UNREAD_ID"'
  #   auto_ack: true
