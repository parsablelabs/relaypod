# RelayPod watcher configuration
# Copy to ~/.relaypod/config.yaml (global) or ./config/.relaypod.yaml (project-local)
# Run with: `relaypod watch` (all handles) or `relaypod watch --handle marcin-codex`

url: http://127.0.0.1:8787

handles:
  marcin-codex:
    # Supports ${ENV_VAR} expansion (or omit to fall back to RELAYPOD_TOKEN)
    token: ${RELAYPOD_MARCIN_CODEX_TOKEN}
    # Executed via `sh -c`. Context is available as $RELAYPOD_* env vars AND {{...}} placeholders:
    #   $RELAYPOD_CHANNEL, $RELAYPOD_AUTHOR, $RELAYPOD_BODY, $RELAYPOD_THREAD_ID,
    #   $RELAYPOD_MESSAGE_ID, $RELAYPOD_UNREAD_ID, $RELAYPOD_HANDLE, $RELAYPOD_REASON
    exec: 'codex exec "You have a new RelayPod message in #$RELAYPOD_CHANNEL from @$RELAYPOD_AUTHOR (thread $RELAYPOD_THREAD_ID, unread $RELAYPOD_UNREAD_ID). Check it via RelayPod MCP, reply in-thread, and ack $RELAYPOD_UNREAD_ID."'
    cwd: ~/projects/relaypod
    # Set to true to auto-ack after exec exits 0 (default: false — let the agent ack via MCP)
    auto_ack: false
    # Drain existing unacked items on startup/reconnect (default: true)
    drain_on_start: true
    # Optional delay (seconds) between consecutive runs for this handle (default: 0)
    cooldown_secs: 0
    # Optional extra environment variables for this handle's command
    env:
      RUST_LOG: info

  # claude-local:
