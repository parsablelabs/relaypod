name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-${{ matrix.arch }}

      - name: Determine version tag
        id: meta
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          VERSION="${TAG#v}"
          BUNDLE_VERSION="${VERSION%%-*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_version=$BUNDLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p relaypod-cli -p relaypod-ui

      - name: Package CLI/server tarball
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          STAGE="dist/relaypod-${TAG}-macos-${{ matrix.arch }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/relaypod" "$STAGE/"
          cp LICENSE README.md config/config.example.yaml config/server.example.yaml "$STAGE/"
          tar -C dist -czf "dist/relaypod-${TAG}-macos-${{ matrix.arch }}.tar.gz" "relaypod-${TAG}-macos-${{ matrix.arch }}"

      - name: Build RelayPod.app and DMG (UI)
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          BUNDLE_VERSION="${{ steps.meta.outputs.bundle_version }}"
          APP="dist/dmg-root/RelayPod.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp "target/${{ matrix.target }}/release/relaypod-ui" "$APP/Contents/MacOS/relaypod-ui"
          chmod +x "$APP/Contents/MacOS/relaypod-ui"

          # Generate .icns from assets/icon-256.png
          ICONSET="dist/RelayPod.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256; do
            sips -z "$size" "$size" assets/icon-256.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
          done
          cp "$ICONSET/icon_32x32.png" "$ICONSET/icon_16x16@2x.png"
          cp "$ICONSET/icon_64x64.png" "$ICONSET/icon_32x32@2x.png"
          cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/RelayPod.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>RelayPod</string>
            <key>CFBundleDisplayName</key>
            <string>RelayPod</string>
            <key>CFBundleIdentifier</key>
            <string>dev.parsablelabs.relaypod</string>
            <key>CFBundleVersion</key>
            <string>${BUNDLE_VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>relaypod-ui</string>
            <key>CFBundleIconFile</key>
            <string>RelayPod</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc sign so Apple Silicon accepts the bundle locally
          codesign --force --deep --sign - "$APP"

          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "RelayPod ${TAG}" \
            -srcfolder dist/dmg-root \
            -ov -format UDZO \
            "dist/RelayPod-${TAG}-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/relaypod-*-macos-${{ matrix.arch }}.tar.gz
            dist/RelayPod-*-macos-${{ matrix.arch }}.dmg

  build-linux:
    name: Build Linux (x86_64)
    # Build on Ubuntu 22.04 (glibc 2.35) for broad distro compatibility (Ubuntu, Debian, Fedora, Arch, etc.)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-x86_64

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            file

      - name: Determine version tag
        id: meta
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: |
          cargo build --release -p relaypod-cli -p relaypod-ui

      - name: Package universal Linux tarball (with install.sh)
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          STAGE="dist/relaypod-${TAG}-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/release/relaypod "$STAGE/"
          cp target/release/relaypod-ui "$STAGE/"
          cp assets/icon-256.png "$STAGE/relaypod.png"
          cp LICENSE README.md config/config.example.yaml config/server.example.yaml "$STAGE/"

          cat > "$STAGE/install.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          BIN_DIR="${HOME}/.local/bin"
          APP_DIR="${HOME}/.local/share/applications"
          ICON_DIR="${HOME}/.local/share/icons/hicolor/256x256/apps"

          mkdir -p "$BIN_DIR" "$APP_DIR" "$ICON_DIR"
          install -m 755 "$SCRIPT_DIR/relaypod" "$BIN_DIR/relaypod"
          install -m 755 "$SCRIPT_DIR/relaypod-ui" "$BIN_DIR/relaypod-ui"
          install -m 644 "$SCRIPT_DIR/relaypod.png" "$ICON_DIR/relaypod.png"

          cat > "$APP_DIR/relaypod.desktop" <<DESKTOP
          [Desktop Entry]
          Name=RelayPod
          Comment=Shared message board for humans and AI agents
          Exec=${BIN_DIR}/relaypod-ui
          Icon=relaypod
          Terminal=false
          Type=Application
          Categories=Network;Chat;Development;
          DESKTOP

          echo "Installed relaypod and relaypod-ui to ${BIN_DIR}"
          case ":$PATH:" in
            *":${BIN_DIR}:"*) ;;
            *) echo "Note: add '${BIN_DIR}' to your PATH to run 'relaypod' from any shell." ;;
          esac
          EOF
          chmod +x "$STAGE/install.sh"

          tar -C dist -czf "dist/relaypod-${TAG}-linux-x86_64.tar.gz" "relaypod-${TAG}-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/relaypod-*-linux-x86_64.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
